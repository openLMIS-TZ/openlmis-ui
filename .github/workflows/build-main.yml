name: Build main

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build image
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_UBAB_USERNAME }}
          password: ${{ secrets.DOCKER_UBAB_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Compile and package
        run: |
          version="$(grep '^version=' project.properties | cut -d= -f2)"
          tag="${version}-${GITHUB_SHA::8}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_PATH=/v2 \
            --cache-from type=gha,scope=openlmis-ui-main \
            --cache-to type=gha,scope=openlmis-ui-main,mode=max \
            --push \
            -t "ubabtz/openlmis-ui:${tag}" \
            .
          echo "Pushed ubabtz/openlmis-ui:${tag}"
          {
            echo "### Image"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`ubabtz/openlmis-ui:${tag}\` |"
            echo "| Version | \`${version}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo ""
            echo "The image was not pushed."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Service | \`openlmis-ui\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
